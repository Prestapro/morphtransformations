                            ).join('') + '</div>';
                    }
                    const stageNames = {exposition:'Экспозиция',rising_action:'Развитие',climax:'Кульминация',falling_action:'Спад',denouement:'Развязка'};
                    const stageColors = {exposition:'oklch(0.55 0.12 250)',rising_action:'oklch(0.72 0.14 85)',climax:'oklch(0.64 0.22 25)',falling_action:'oklch(0.60 0.10 170)',denouement:'oklch(0.72 0.17 150)'};
                    const foundStages = [...new Set(a.stages)];
                    const legendHtml = '<div class="arc-legend">' + foundStages.map(s =>
                        `<span class="arc-legend-item"><span class="arc-legend-dot" style="background:${stageColors[s]}"></span>${stageNames[s]||s}</span>`
                    ).join('') + '</div>';
                    return `
                        <div class="insp-section-title">Сюжетная арка</div>
                        <div class="insp-row"><span class="insp-label">B (красота)</span><span class="beauty-score" style="color:${bColor}">${a.beauty_score.toFixed(3)}</span></div>
                        <div class="beauty-bar"><div class="beauty-fill" style="width:${a.beauty_score*100}%;background:${bColor}"></div></div>
                        <div class="insp-row"><span class="insp-label">Неожиданность S</span><span class="insp-value">${a.surprise}</span></div>
                        <div class="insp-row"><span class="insp-label">Неизбежность I</span><span class="insp-value">${a.inevitability}</span></div>
                        <div class="insp-row"><span class="insp-label">Каузальность K</span><span class="insp-value">${a.causality}</span></div>
                        <div class="insp-row"><span class="insp-label">Арки закрыты A</span><span class="insp-value" style="color:${a.arc_closure < 1 ? 'var(--signal-high)' : 'var(--signal-low)'}">${a.arc_closure}</span></div>
                        <div class="insp-row"><span class="insp-label">Событий (SRL)</span><span class="insp-value">${a.n_events}</span></div>
                        ${legendHtml}
                        ${diagHtml}
                    `;
                })() : ''}
                ${popHtml}
                ${referenceHtml}
                ${sceneHtml}
                <div class="insp-hint">Выберите клип на таймлайне или предложение в тексте, чтобы увидеть его спектр. Зелёное — «дешёвые» когнатные корни, красное — редкие информационные пики.</div>`;
        }
    }

    // ── Timeline ──
    function renderTimeline() {
        const footer = document.getElementById('timelineFooter');
        const timelineButton = document.getElementById('btnTimeline');
        if (timelineButton) {
            timelineButton.classList.toggle('active', timelineVisible);
            timelineButton.textContent = timelineVisible ? 'Скрыть шкалу' : 'Показать шкалу';
        }
        footer.classList.toggle('timeline-hidden', !timelineVisible);
        if (!timelineVisible) { footer.innerHTML = ''; return; }
        if (!clips.length) { footer.innerHTML = ''; return; }

        const topActors = actorList.slice(0, 4);
        const hasDialogue = clips.some(c => c.isDialogue);
        const hasSentiment = clips.some(c => c.sentiment !== 0);
        const cellW = Math.max(32, Math.min(80, 6 * Math.max(...clips.map(c => c.wordCount), 4)));

        function cw(clip) { return Math.max(32, Math.min(120, clip.wordCount * 6)); }

        // Track definitions
        const tracks = [];
        // Ruler
        tracks.push({ id:'ruler', label:`Клипы · ${clips.length}`, dot:null, h:24 });
        // Entropy
        tracks.push({ id:'entropy', label:'Entropy', dot:'var(--signal-low)', h:56 });
        // Operators
        tracks.push({ id:'operators', label:'Operators', dot:'var(--neon)', h:36 });
        // Sentiment
        if (hasSentiment) tracks.push({ id:'sentiment', label:'Valence', dot:'var(--signal-low)', h:40 });
        // Arousal
        const hasArousal = clips.some(c => c.avgArousal > 0);
        if (hasArousal) tracks.push({ id:'arousal', label:'Arousal', dot:'oklch(0.68 0.20 15)', h:36 });
        // Concreteness
        const hasConcreteness = clips.some(c => c.avgConcreteness > 0);
        if (hasConcreteness) tracks.push({ id:'concreteness', label:'Concr.', dot:'oklch(0.65 0.18 300)', h:36 });
        // Rhythm
        if (rhythm.length > 1) tracks.push({ id:'rhythm', label:'Rhythm', dot:'oklch(0.75 0.14 60)', h:36 });
        // Role tracks: one row per detected actor/speaker.
        topActors.forEach((a, ai) => {
            tracks.push({ id:'actor', actorName: a.name, label: a.name, dot: ACTOR_HEX[ai], h:28 });
        });
        // Dialogue
        if (hasDialogue) tracks.push({ id:'dialogue', label:'Dialogue', dot:'var(--text-muted)', h:28 });
        // Plot Arc track
        if (plotArc && plotArc.stages && plotArc.stages.length > 0) {
            tracks.push({ id:'arc', label:'Арка', dot:'oklch(0.64 0.22 25)', h:28 });
        }

        let html = `<div class="timeline-toolbar" aria-label="Управление шкалой">
            <button class="timeline-tool" title="Очистить выбор" aria-label="Очистить выбор" onclick="clearTimelineSelection()">×</button>
            <button class="timeline-tool" title="Скрыть шкалу" aria-label="Скрыть шкалу" onclick="toggleTimeline()">−</button>
        </div><div class="timeline-inner">`;
        tracks.forEach(tr => {
            // A clicked track takes precedence; otherwise mirror the top highlight mode.
            let rowCls = 't-row';
            if (tr.id === 'ruler') rowCls += ' t-row-ruler';
            const explicitMatch = focusedTrack && focusedTrack.id === tr.id &&
                (!focusedTrack.actorName || focusedTrack.actorName === tr.actorName);
            const modeMatch = !focusedTrack && (
                (hlMode === 'roles' && tr.id === 'actor') ||
                (hlMode === 'entropy' && tr.id === 'entropy') ||
                (hlMode === 'structure' && (tr.id === 'ruler' || tr.id === 'dialogue'))
            );
            const timelineFiltered = focusedTrack || ['roles', 'entropy', 'structure'].includes(hlMode);
            if (timelineFiltered) rowCls += (explicitMatch || modeMatch) ? ' t-focused' : ' t-dimmed';
            // Track key for onclick
            const trackKey = tr.id === 'actor'
                ? `{id:'actor',actorName:'${tr.actorName.replace(/'/g, "\\'")}'}`
                : `{id:'${tr.id}'}`;

            html += `<div class="${rowCls}">`;
            html += `<div class="t-label ${explicitMatch || modeMatch ? 'focused' : ''}" style="height:${tr.h}px" onclick="event.stopPropagation();toggleTrackFocus(${trackKey})">`;
            if (tr.dot) html += `<span class="t-dot" style="background:${tr.dot}"></span>`;
            html += `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(tr.label)}</span></div>`;
            html += `<div class="t-cells">`;
            clips.forEach(clip => {
                const sel = selectedClip === clip.index;
                const w = cw(clip);
                const paraEdge = clip.startsNewParagraph ? 'border-left:2px solid oklch(1 0 0 / 18%);' : '';
                html += `<div class="t-cell${sel?' sel':''}" style="width:${w}px;height:${tr.h}px;${paraEdge}" data-tclip="${clip.index}" onclick="selectClip(${clip.index})">`;

                switch(tr.id) {
                    case 'ruler': {
                        const label = String(clip.index+1).padStart(2,'0');
                        const isHeading = clip._breakType === 'heading';
                        const isSpeaker = clip._breakType === 'speaker';
                        if (isHeading) {
                            html += `<span style="display:flex;align-items:center;gap:2px;"><span style="color:oklch(0.85 0.18 85);font-size:0.7em;">◆</span>${label}</span>`;
                        } else if (isSpeaker) {
                            html += `<span style="display:flex;align-items:center;gap:1px;"><span style="color:oklch(0.7 0.12 200);font-size:0.5em;">●</span>${label}</span>`;
                        } else {
                            html += `<span>${label}</span>`;
                        }
                        break;
                    }
                    case 'entropy': {
                        // Mini bars per word-token
                        const words = clip.tokens.filter(t => t.word[0] && t.word[0].match(/[а-яА-Яa-zA-Z0-9]/));
                        if (words.length) {
                            const barW = Math.max(1, Math.floor((w - 4) / words.length) - 1);
                            let bars = '<span style="position:absolute;inset:2px;display:flex;align-items:flex-end;gap:1px;">';
                            words.forEach(wt => {
                                const h = wt.h || 0.5;
                                const pct = Math.max(8, Math.min(95, h * 12));
                                bars += `<span style="flex:1;min-width:1px;height:${pct}%;background:${entropyColor(h,0.85)};border-radius:1px 1px 0 0;"></span>`;
                            });
                            bars += '</span>';
                            html += bars;
                        }
                        break;
                    }
                    case 'operators': {
                        const ops = clip.operators.slice(0, 5);
                        if (ops.length) {
                            html += `<span style="display:flex;gap:3px;overflow:hidden;">`;
                            ops.forEach(op => {
                                const opc = OP_COLOR[op.kind] || 'var(--primary)';
                                html += `<span class="opsym" style="color:${opc};text-shadow:0 0 4px ${opc.replace(')', ' / 40%)')}" title="${OP_LABEL[op.kind]||op.kind}: ${escHtml(op.word)}">${OP_SYM[op.kind]||'•'}</span>`;
                            });
                            html += `</span>`;
                        }
                        break;
                    }
                    case 'sentiment': {
                        html += '<div class="sbar-mid"></div>';
                        // Use continuous valence if available, fall back to binary
                        const val = clip.avgValence || 0;
                        if (val > 0) {
                            // Map valence 1-9 to deviation from midpoint (5)
                            const dev = (val - 5) / 4; // -1 to +1
                            const pct = Math.abs(dev) * 45;
                            const isPos = dev > 0;
                            html += `<div class="sbar" style="height:${pct}%;${isPos?'bottom':'top'}:50%;background:${isPos?'var(--signal-low)':'var(--signal-high)'}" title="val=${val.toFixed(1)}"></div>`;
                        } else if (clip.sentiment !== 0) {
                            const pct = Math.abs(clip.sentiment) * 45;
                            const isPos = clip.sentiment > 0;
                            html += `<div class="sbar" style="height:${pct}%;${isPos?'bottom':'top'}:50%;background:${isPos?'var(--signal-low)':'var(--signal-high)'}"></div>`;
                        }
                        break;
                    }
                    case 'arousal': {
                        const aro = clip.avgArousal;
                        if (aro > 0) {
                            const pct = Math.max(8, Math.min(92, ((aro - 1) / 8) * 85));
                            html += `<div style="position:absolute;bottom:2px;left:2px;right:2px;height:${pct}%;background:${arousalColor(aro, 0.7)};border-radius:2px 2px 0 0;" title="arousal=${aro.toFixed(1)}"></div>`;
                        }
                        break;
                    }
                    case 'concreteness': {
                        const conc = clip.avgConcreteness;
                        if (conc > 0) {
                            const pct = Math.max(8, Math.min(92, ((conc - 1) / 4) * 85));
                            html += `<div style="position:absolute;bottom:2px;left:2px;right:2px;height:${pct}%;background:${concColor(conc, 0.7)};border-radius:2px 2px 0 0;" title="conc=${conc.toFixed(1)}"></div>`;
                        }
                        break;
                    }
                    case 'actor': {
                        if (clip.actors.includes(tr.actorName) || clip.tokens.some(token =>
                            (token.speaker === tr.actorName || token.clean === tr.actorName) &&
                            token.line_type !== 'HEADER' && token.line_type !== 'CHARACTERS_LINE' &&
                            token.line_type !== 'SPEAKER' && token.line_type !== 'STAGE_DIRECTION')) {
                            html += `<div class="actor-block" style="background:${tr.dot}"></div>`;
                        }
                        break;
                    }
                    case 'dialogue': {
                        if (clip.isDialogue) html += `<div class="dial-block"></div>`;
                        break;
                    }
                    case 'rhythm': {
                        // Map clip index to rhythm entry (sentence lengths)
                        const rIdx = clip.index;
                        if (rIdx < rhythm.length) {
                            const maxR = Math.max(...rhythm, 1);
                            const rVal = rhythm[rIdx];
                            const pct = Math.max(8, Math.min(95, (rVal / maxR) * 90));
                            const hue = 60 + (1 - rVal/maxR) * 40; // short=warm, long=orange
                            html += `<div style="position:absolute;bottom:2px;left:2px;right:2px;height:${pct}%;background:oklch(0.72 0.14 ${hue} / 75%);border-radius:2px 2px 0 0;" title="${rVal} слов"></div>`;
                        }
                        break;
                    }
                    case 'arc': {
                        if (plotArc && plotArc.stages.length > 0) {
                            const nEv = plotArc.stages.length;
                            const evIdx = Math.min(nEv - 1, Math.floor(clip.index / Math.max(clips.length, 1) * nEv));
                            const stage = plotArc.stages[evIdx];
                            html += `<div class="arc-cell arc-${stage}"></div>`;
                            if (stage === 'climax') html += `<div class="arc-label">⭐</div>`;
                        }
                        break;
                    }
                }
                html += `</div>`;
            });
            html += `</div></div>`;
        });
        html += '</div>';

        // ── Tension curve SVG overlay ──
        // Compute smoothed entropy per clip (moving average, window=3)
        const eVals = clips.map(c => c.avgEntropy);
        const smoothed = eVals.map((v, i) => {
            const lo = Math.max(0, i - 1), hi = Math.min(eVals.length - 1, i + 1);
            let sum = 0, cnt = 0;
            for (let j = lo; j <= hi; j++) { sum += eVals[j]; cnt++; }
            return sum / cnt;
        });
        const maxSmoothed = Math.max(...smoothed, 1);
        // Compute cumulative X positions matching clip cell widths
        // SVG is placed inside .t-cells (no label offset needed)
        let cumX = 0;
        const xs = clips.map(c => { const x = cumX + cw(c)/2; cumX += cw(c); return x; });
        const totalW = cumX;
        const entropyH = 56; // entropy track height
        const points = smoothed.map((v, i) => {
            const x = xs[i];
            const y = entropyH - 4 - (v / maxSmoothed) * (entropyH - 8);
            return `${x},${y}`;
        }).join(' ');
        html += `<svg class="tension-curve" width="${totalW}" height="${entropyH}" style="position:absolute;top:0;left:0;pointer-events:none;">
            <polyline points="${points}" fill="none" stroke="oklch(0.90 0.01 260 / 45%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>`;

        footer.innerHTML = html;
        // Position SVG over entropy track
        requestAnimationFrame(() => {
            const svg = footer.querySelector('.tension-curve');
            const entropyRow = footer.querySelectorAll('.t-row')[1]; // 2nd row = entropy
            if (svg && entropyRow) {
                const cells = entropyRow.querySelector('.t-cells');
                if (cells) {
                    cells.style.position = 'relative';
                    svg.style.left = '0';
                    svg.style.top = '0';
                    cells.appendChild(svg);
                }
            }
        });

        // Keep the selected timeline cell visible in the horizontal scale.
        if (selectedClip !== null) {
            const el = footer.querySelector(`[data-tclip="${selectedClip}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        // Selecting a point on the scale also moves the reading pane to its text.
        if (selectedClip !== null) {
            const textEl = document.querySelector(`.clip-span[data-clip="${selectedClip}"], .large-document-text [data-clip="${selectedClip}"]`);
            if (textEl) {
                const pane = document.getElementById('textPane');
                const paneBox = pane.getBoundingClientRect();
                const textBox = textEl.getBoundingClientRect();
                pane.scrollBy({
                    top: textBox.top - paneBox.top - (pane.clientHeight - textBox.height) / 2,
                    behavior: 'smooth'
                });
            }
        }
    }

    // ── Interactions ──
    function selectClip(idx) {
        selectedClip = (selectedClip === idx) ? null : idx;
        render();
    }

    function toggleTrackFocus(track) {
        if (focusedTrack && focusedTrack.id === track.id &&
            (!track.actorName || focusedTrack.actorName === track.actorName)) {
            focusedTrack = null; // deselect
        } else {
            focusedTrack = track;
        }
        renderTimeline();
        renderTextPane();
        renderInspector();
        scrollToFocusedTrack();
    }

    function scrollToFocusedTrack() {
        if (!focusedTrack) return;
        let clipIndex = -1;
        for (const clip of clips) {
            const matches = focusedTrack.id === 'actor'
                ? clip.actors.includes(focusedTrack.actorName)
                : focusedTrack.id === 'dialogue'
                    ? clip.isDialogue
                    : focusedTrack.id === 'operators'
                        ? clip.operators.length > 0
                        : focusedTrack.id === 'entropy'
                            ? clip.avgEntropy > 0
                            : focusedTrack.id === 'sentiment'
                                ? clip.sentiment !== 0 || clip.avgValence > 0
                                : focusedTrack.id === 'arousal'
                                    ? clip.avgArousal > 0
                                    : focusedTrack.id === 'concreteness'
                                        ? clip.avgConcreteness > 0
                                        : true;
            if (matches) { clipIndex = clip.index; break; }
        }
        if (clipIndex < 0) return;
        selectedClip = clipIndex;
        renderTextPane();
        renderInspector();
        requestAnimationFrame(() => {
            const textEl = document.querySelector(`.clip-span[data-clip="${clipIndex}"], .large-document-text [data-clip="${clipIndex}"]`);
            if (textEl) {
                const pane = document.getElementById('textPane');
                const paneBox = pane.getBoundingClientRect();
                const textBox = textEl.getBoundingClientRect();
                pane.scrollBy({
                    top: textBox.top - paneBox.top - (pane.clientHeight - textBox.height) / 2,
                    behavior: 'smooth'
                });
            }
            const scaleEl = document.querySelector(`[data-tclip="${clipIndex}"]`);
            if (scaleEl) scaleEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });
    }

    function formatRawTextForEditing(text) {
        if (!text) return '';
        const lines = text.split('\n');
        const parts = [];
        let paragraphLines = [];
        
        const flushParagraph = () => {
            if (paragraphLines.length) {
                parts.push(`<p>${escHtml(paragraphLines.join('\n'))}</p>`);
                paragraphLines = [];
            }
        };
        
        lines.forEach(line => {
            const trimmed = line.trim();
            const isChapter = /^[IVXLCDM\d]+$/i.test(trimmed) || /^(Глава|Chapter)\s+/i.test(trimmed);
            
            if (isChapter) {
                flushParagraph();
                parts.push(`<hr class="chapter-rule" aria-hidden="true"><h3 class="chapter-anchor">${escHtml(line)}</h3>`);
            } else if (trimmed === '') {
                flushParagraph();
            } else {
                paragraphLines.push(line);
            }
        });
        flushParagraph();
        return parts.join('');
    }

    function toggleEdit() {
        const btn = document.getElementById('btnEdit');
        const pane = document.getElementById('textPane');
        
        // Capture scroll percentage before toggle
        if (pane) {
            const denom = pane.scrollHeight - pane.clientHeight;
            lastScrollPercent = denom > 0 ? pane.scrollTop / denom : 0;
        }

        if (!editing) {
            editing = true;
            btn.textContent = 'Спектр';
            btn.classList.add('active');
            renderTextPane();
        } else {
            editing = false;
            btn.textContent = 'Правка';
            btn.classList.remove('active');
            const area = document.getElementById('editArea');
            if (area) {
                const text = area.innerText;
                if (text.trim()) {
                    analyze(text);
                } else {
                    renderTextPane();
                }
            }
        }
    }

    function clearTimelineSelection() {
        selectedClip = null;
        focusedTrack = null;
        hlMode = 'all';
        document.getElementById('hlModeLabel').textContent = HL_LABELS.all;
        document.querySelectorAll('.hl-picker-item').forEach(el => {
            el.classList.toggle('active', el.dataset.mode === 'all');
        });
        render();
    }

    function toggleTimeline() {
        timelineVisible = !timelineVisible;
        renderTimeline();
    }

    function toggleInspector() {
        inspectorVisible = !inspectorVisible;
        const btn = document.getElementById('btnInsp');
        btn.classList.toggle('dimmed', !inspectorVisible);
        renderInspector();
    }

    function toggleTheme() {
        lightTheme = !lightTheme;
        document.body.classList.toggle('theme-light', lightTheme);
        try { localStorage.setItem('logos_spectrum_theme', lightTheme ? 'light' : 'dark'); } catch (_) {}
    }

    let hlMode = 'all';
    const HL_MODES = ['all', 'roles', 'entropy', 'structure', 'clean'];
    const HL_LABELS = { all: 'Все', roles: 'Роли', entropy: 'Энтропия', structure: 'Структура', clean: 'Чисто' };

    function toggleHlPicker() {
        document.getElementById('hlPicker').classList.toggle('open');
    }

    function setHlMode(mode) {
        hlMode = mode;
        const pane = document.getElementById('textPane');
        // Remove all mode classes
        HL_MODES.forEach(m => pane.classList.remove('hl-' + m));
        // Apply new mode (all = no class needed)
        if (mode !== 'all') pane.classList.add('hl-' + mode);
        // Update button label
        document.getElementById('hlModeLabel').textContent = HL_LABELS[mode];
        // Update active state in picker
        document.querySelectorAll('.hl-picker-item').forEach(el => {
            el.classList.toggle('active', el.dataset.mode === mode);
        });
        // Mirror the selected text layer in the lower timeline.
        if (!focusedTrack) renderTimeline();
        // Close picker
        document.getElementById('hlPicker').classList.remove('open');
    }

    // The gray workspace outside the white content page clears all active UI filters.
    document.addEventListener('click', e => {
        if (selectedClip === null && !focusedTrack && hlMode === 'all') return;
        if (e.target.closest('.text-content, [data-tclip], .t-label, .timeline-tool, #btnHighlights, #hlPicker')) return;
        clearTimelineSelection();
    });

    // Close picker on outside click
    document.addEventListener('click', e => {
        const picker = document.getElementById('hlPicker');
        const btn = document.getElementById('btnHighlights');
        if (picker && !picker.contains(e.target) && !btn.contains(e.target)) {
            picker.classList.remove('open');
        }
    });

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function downloadBlob(contents, filename, type = 'text/plain;charset=utf-8') {
        const blob = new Blob([contents], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
    }

    function downloadText() {
        if (!originalText) return;
        downloadBlob(originalText, `text_${new Date().getTime()}.txt`);
    }

    function downloadRoles() {
        const roles = actorList.map(({ name, count }) => ({
            name,
            mentions: count,
            clips: clips.filter(clip => clip.actors.includes(name)).map(clip => clip.index + 1),
        }));
        downloadBlob(JSON.stringify({ roles }, null, 2), `roles_${new Date().getTime()}.json`, 'application/json;charset=utf-8');
    }

    function downloadScript() {
        if (!clips.length) return;
        let out = `Logos Spectrum v5.2 — Narrative Script Export\n`;
        out += `==============================================\n\n`;
        clips.forEach(c => {
            const type = c.isDialogue ? '[DIALOGUE]' : '[NARRATIVE]';
            const actors = c.actors.length ? ` {Actors: ${c.actors.join(', ')}}` : '';
            const h = ` [H: ${c.avgEntropy.toFixed(1)}]`;
            out += `${type}${h}${actors}\n${c.text.trim()}\n\n`;
        });
        downloadBlob(out, `script_export_${new Date().getTime()}.txt`);
        toast('Script exported!');
    }

    // ── Init ──
    window.onload = () => {
        lightTheme = localStorage.getItem('logos_spectrum_theme') === 'light';
        document.body.classList.toggle('theme-light', lightTheme);
        const saved = localStorage.getItem('logos_spectrum_text');
        if (saved) {
            analyze(saved);
        } else {
            analyze(SAMPLE);
        }
    };
    </script>
</body>
</html>
