<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Logos Spectrum v5.2 — Narrative DAW</title>
    <meta name="description" content="Монтажный анализ текста: энтропия, операторы, сентимент, актёры и диалоги.">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Literata:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════
           Logos Spectrum v5.2 — Narrative DAW Design System
           ═══════════════════════════════════════════════════ */
        :root {
            --bg: oklch(0.13 0.004 260);
            --panel: oklch(0.155 0.005 260);
            --surface: oklch(0.17 0.005 260);
            --border: oklch(1 0 0 / 9%);
            --border-subtle: oklch(1 0 0 / 5%);

            --text: oklch(0.93 0.005 260);
            --text-muted: oklch(0.62 0.01 260);
            --text-dim: oklch(0.45 0.008 260);

            --primary: oklch(0.68 0.17 250);
            --primary-fg: oklch(0.13 0.004 260);
            --neon: oklch(0.68 0.17 250);
            --neon-glow: oklch(0.68 0.17 250 / 40%);

            --signal-low: oklch(0.72 0.17 150);
            --signal-high: oklch(0.64 0.2 25);
            --signal-amber: oklch(0.78 0.14 85);

            --accent-bg: oklch(0.24 0.02 250);
            --selection-bg: oklch(0.68 0.17 250 / 24%);
            --selection-border: oklch(0.78 0.14 85 / 80%);

            --font-sans: 'Inter', system-ui, sans-serif;
            --font-serif: 'Literata', 'Georgia', serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 6px;

            /* Actor palette */
            --actor-1: oklch(0.78 0.14 85);
            --actor-2: oklch(0.68 0.17 250);
            --actor-3: oklch(0.72 0.17 150);
            --actor-4: oklch(0.64 0.2 25);
            --actor-5: oklch(0.65 0.18 300);
            --actor-6: oklch(0.72 0.16 55);
            --actor-7: oklch(0.70 0.14 185);
            --actor-8: oklch(0.68 0.18 340);

            /* Vercel App Design tokens */
            --spacing: .25rem;
            --container-2xl: 42rem;
            --text-xs: .75rem;
            --text-xs--line-height: calc(1 / .75);
            --text-sm: .875rem;
            --text-sm--line-height: calc(1.25 / .875);
            --text-2xl: 1.5rem;
            --text-2xl--line-height: calc(2 / 1.5);
            --text-3xl: 1.875rem;
            --text-3xl--line-height: calc(2.25 / 1.875);
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --tracking-tight: -.025em;
            --tracking-wide: .025em;
            --leading-snug: 1.375;
            --leading-relaxed: 1.625;
            --radius-md: calc(var(--radius) * .8);
            --animate-ping: ping 1s cubic-bezier(0, 0, .2, 1) infinite;
            --default-transition-duration: .15s;
            --default-transition-timing-function: cubic-bezier(.4, 0, .2, 1);
            --font-jetbrains: 'JetBrains Mono', monospace;
            --default-font-family: var(--font-jetbrains), ui-monospace, monospace;
            --default-mono-font-family: var(--font-jetbrains), ui-monospace, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ──────────────────────────────────── */
        header {
            height: 44px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            flex-shrink: 0;
            z-index: 20;
        }
        .logo-group { display: flex; align-items: center; gap: 8px; }
        .logo-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--neon-glow);
        }
        .logo {
            font-family: var(--font-mono);
            font-weight: 600; font-size: 0.85rem;
            letter-spacing: -0.02em;
        }
        .logo .ver { color: var(--text-muted); font-weight: 400; }
        .header-sub {
            font-family: var(--font-mono);
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text-dim);
        }
        .header-right {
            margin-left: auto;
            display: flex; align-items: center; gap: 8px;
        }
        .header-stats {
            font-family: var(--font-mono);
            font-size: 11px; color: var(--text-muted);
        }
        .btn {
            font-family: var(--font-mono);
            font-size: 11px; font-weight: 500;
            padding: 4px 10px; border-radius: var(--radius);
            border: none; cursor: pointer;
            transition: all 0.15s;
        }
        .btn-secondary {
            background: oklch(0.22 0.006 260);
            color: var(--text);
        }
        .btn-secondary:hover { background: oklch(0.26 0.006 260); }
        .btn-secondary.active, .btn-primary {
            background: var(--primary);
            color: var(--primary-fg);
        }
        .btn-secondary.dimmed { opacity: 0.6; }
        .ui-icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        /* ── Main area ───────────────────────────────── */
        .main-area {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .library-sidebar {
            width: 248px;
            flex: 0 0 248px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 18px 12px;
        }
        .library-kicker { font: 10px var(--font-mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
        .library-title { font-size: 16px; line-height: 1.3; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .text-content h1, .text-content h2, .text-content h3, .text-content h4, .text-content h5, .text-content h6 { font-family: var(--font-sans); text-align: center; color: var(--text); line-height: 1.25; font-weight: 600; }
        .text-content h1 { font-size: 2rem; margin: 2.2rem 0 1.2rem; }
        .text-content h2 { font-size: 1.5rem; margin: 1.8rem 0 1rem; }
        .text-content h3 { font-size: 1.25rem; margin: 1.5rem 0 .8rem; }
        .text-content h4 { font-size: 1.1rem; margin: 1.2rem 0 .6rem; }
        .text-content h5 { font-size: 1rem; margin: 1rem 0 .5rem; }
        .text-content h6 { font-size: .9rem; margin: .8rem 0 .4rem; }
        .library-author { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
        .library-meta { font: 10px var(--font-mono); color: var(--text-dim); padding: 8px 0; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); margin-bottom: 12px; }
        .chapter-list { display: flex; flex-direction: column; gap: 3px; }
        .chapter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            border-radius: var(--radius);
            padding: 6px 8px;
            text-align: left;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            font: 11px var(--font-sans);
            transition: background 0.15s, color 0.15s;
        }
        .chapter-item:hover {
            background: var(--surface);
            color: var(--text);
        }
        .chapter-item.active {
            background: color-mix(in srgb, var(--primary) 12%, transparent);
            color: var(--primary);
        }
        .chapter-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--text-dim);
            transition: background 0.15s;
        }
        .chapter-item.confirmed .chapter-dot {
            background: var(--primary);
        }
        .chapter-item.unknown .chapter-dot {
            background: var(--signal-amber);
        }
        .chapter-bar-container {
            height: 4px;
            flex: 1;
            overflow: hidden;
            border-radius: 2px;
            background: var(--border-subtle);
        }
        .chapter-bar {
            height: 100%;
            border-radius: 2px;
            background: var(--text-dim);
            opacity: 0.5;
        }
        .chapter-item.confirmed .chapter-bar {
            background: var(--primary);
            opacity: 0.7;
        }
        .chapter-item.unknown .chapter-bar {
            background: var(--signal-amber);
            opacity: 0.7;
        }
        .chapter-count {
            width: 32px;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }
        .chapter-empty { color: var(--text-dim); font-size: 11px; line-height: 1.5; padding: 8px 2px; }
        @media (max-width: 760px) { .library-sidebar { width: 190px; flex-basis: 190px; } }

        /* ── Text Pane ───────────────────────────────── */
        .text-pane {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            min-width: 0;
            background: var(--bg-secondary);
        }
        .text-pane.editing { padding: 32px; }
        .text-pane.editing .edit-area {
            display: block;
            width: 100%;
            height: auto;
            min-height: calc(100% - 64px);
            margin: 0 auto;
            padding: 72px 96px;
            box-sizing: border-box;
            border: 1px solid var(--border-subtle) !important;
            outline: none;
            overflow: hidden;
            background: var(--surface) !important;
            color: var(--text);
            font-family: var(--font-serif) !important;
            font-size: 17px !important;
            line-height: 1.75 !important;
            box-shadow: 0 16px 48px -24px rgb(0 0 0 / 50%) !important;
        }
        .text-content {
            display: block;
            /* A4-like reading page: Word's normal 1-inch side margins. */
            max-width: 794px;
            min-height: calc(100% - 64px);
            margin: 0 auto;
            padding: 72px 96px;
            box-shadow: 0 16px 48px -24px rgb(0 0 0 / 50%);
            border: 1px solid var(--border-subtle);
            font-family: var(--font-serif);
            font-size: 17px;
            line-height: 1.75;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: var(--text);
            text-align: justify;
            hyphens: auto;
            -webkit-hyphens: auto;
            text-justify: inter-word;
            letter-spacing: 0.01em;
            box-sizing: border-box;
            background: var(--surface);
        }
        @media (max-width: 900px) {
            .text-pane { padding: 16px; }
            .text-content { padding: 48px 56px; }
        }
        @media (max-width: 600px) {
            .text-pane { padding: 0; }
            .text-content { padding: 32px 24px; box-shadow: none; }
        }
        .large-document-text { white-space: normal; text-align: left; }
        /* Large-document rendering emits structural classes token by token.
           Keep them inline so a false/partial line classification cannot turn
           every token into a separate block; real chapter headings use h2. */
        .large-document-text .speaker-name,
        .large-document-text .act-header {
            display: inline;
            margin: 0;
            padding: 0;
            border: 0;
            font: inherit;
            letter-spacing: inherit;
            text-align: inherit;
            text-transform: none;
        }
        .large-document-text .speaker-name::after { display: none; }
        .large-document-text p, .edit-area p {
            margin-top: 0;
            margin-bottom: calc(var(--spacing) * 6);
        }
        .large-document-text p:first-child, .edit-area p:first-child { margin-top: 0; }
        .large-document-text h3 + p, .edit-area h3 + p { text-indent: 0; }
        .chapter-rule {
            border: 0;
            height: 1px;
            background: var(--border);
            margin: 48px 0 24px;
            position: relative;
            overflow: visible;
        }
        .chapter-rule::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 12px var(--surface);
        }
        .chapter-anchor {
            display: block;
            scroll-margin-top: 48px;
            padding-top: 12px;
            margin: 40px 0;
            color: var(--primary);
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            text-align: center;
        }
        .semantic-quote { quotes: '«' '»' '„' '“'; color: var(--text-muted); }
        .semantic-quote::before { content: open-quote; }
        .semantic-quote::after { content: close-quote; }
        .semantic-blockquote { margin: 1.5rem 1rem; padding: .8rem 1.2rem; border-left: 3px solid var(--primary); color: var(--text-muted); font-style: italic; }
        .semantic-cite { font-style: italic; color: var(--signal-amber); }
        .semantic-list { margin: .8rem 0 .8rem 1.8rem; }
        .semantic-mark { background: oklch(0.78 0.14 85 / 22%); color: var(--text); padding: 0 .12em; }
        .semantic-underline { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
        .semantic-code { font-family: var(--font-mono); font-size: .9em; color: var(--primary); }
        .text-content .para-break + .clip-span,
        .text-content .clip-span:first-child {
            text-indent: 1.5em;
        }
        .genre-verse_drama .text-content,
        .genre-poetry .text-content {
            text-align: center;
            text-indent: 0;
            max-width: 560px;
            padding: 24px 32px;
            line-height: 1.7;
            white-space: normal;
        }
        .genre-verse_drama .text-content .clip-span,
        .genre-poetry .text-content .clip-span {
            text-indent: 0;
        }

        /* Inline highlights */
        .clip-span {
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .clip-span:hover { background: oklch(0.22 0.006 260 / 60%); }
        .clip-span.selected {
            background: var(--selection-bg);
            outline: 2px solid var(--selection-border);
            outline-offset: 1px;
            box-shadow: 0 0 0 2px oklch(0.68 0.17 250 / 18%);
        }
        .t-cell.sel {
            background: var(--selection-bg) !important;
            box-shadow: inset 0 -2px 0 var(--selection-border);
        }
        body.theme-light {
            --selection-bg: oklch(0.68 0.17 250 / 22%);
            --selection-border: oklch(0.48 0.18 250 / 90%);
        }
        .clip-span.focus-dimmed {
            opacity: 0.2;
            transition: opacity 0.25s;
        }
        .clip-span.focus-bright {
            opacity: 1;
            transition: opacity 0.25s;
        }
        .large-document-text .clip-selected-token {
            background: var(--selection-bg);
            outline: 1px solid var(--selection-border);
            border-radius: 3px;
        }
        .clip-span.is-dialogue { font-style: italic; }

        .tok-operator {
            background: oklch(0.68 0.17 250 / 12%);
            color: var(--primary);
            font-weight: 500;
            padding: 0 2px;
            border-radius: 3px;
        }

        /* Adaptive paragraph breaks — gap reflects semantic distance */
        .para-break-sm {
            display: block;
            height: 12px;
        }
        .para-break-md {
            display: block;
            height: 1px;
            margin: 18px 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                oklch(1 0 0 / 8%) 20%,
                oklch(1 0 0 / 8%) 80%,
                transparent 100%
            );
        }
        .para-break-lg {
            display: block;
            height: 1px;
            margin: 32px auto;
            max-width: 120px;
            background: oklch(1 0 0 / 12%);
            position: relative;
        }
        .para-break-lg::after {
            content: '◆';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: oklch(1 0 0 / 18%);
            background: var(--bg);
            padding: 0 8px;
        }
        /* Legacy compat */
        .para-break { display: block; height: 1px; margin: 18px 0; background: linear-gradient(90deg, transparent 0%, oklch(1 0 0 / 8%) 20%, oklch(1 0 0 / 8%) 80%, transparent 100%); }
        .para-break-spacer {
            display: block;
            height: 12px;
        }

        /* Verse drama / play formatting */
        .speaker-name {
            display: block;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            color: var(--signal-amber);
            margin: 24px 0 6px 0;
            padding: 4px 0;
        }
        .speaker-name::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: oklch(1 0 0 / 10%);
            margin: 4px auto 0;
        }
        .stage-direction {
            display: inline;
            font-style: italic;
            color: var(--text-dim);
            letter-spacing: 0.03em;
        }
        .act-header {
            display: block;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 32px 0 16px;
            padding: 8px 0;
            border-top: 1px solid oklch(1 0 0 / 8%);
            border-bottom: 1px solid oklch(1 0 0 / 8%);
        }
        .genre-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: oklch(0.68 0.17 250 / 15%);
            color: var(--primary);
            letter-spacing: 0.5px;
        }
        /* ── Arc Track ── */
        .arc-cell { position:absolute;inset:2px;border-radius:3px;transition:opacity 0.2s; }
        .arc-exposition { background: oklch(0.55 0.12 250 / 55%); }
        .arc-rising_action { background: oklch(0.72 0.14 85 / 55%); }
        .arc-climax { background: oklch(0.64 0.22 25 / 70%); box-shadow: 0 0 6px oklch(0.64 0.22 25 / 40%); }
        .arc-falling_action { background: oklch(0.60 0.10 170 / 50%); }
        .arc-denouement { background: oklch(0.72 0.17 150 / 50%); }
        .arc-label { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--font-mono);color:oklch(1 0 0 / 80%);text-shadow:0 1px 2px oklch(0 0 0 / 60%);pointer-events:none;white-space:nowrap;overflow:hidden; }
        .arc-legend { display:flex;gap:12px;align-items:center;margin-top:6px;flex-wrap:wrap; }
        .arc-legend-item { display:flex;align-items:center;gap:4px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted); }
        .arc-legend-dot { width:10px;height:10px;border-radius:2px; }
        .diag-badge { display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:10px;font-family:var(--font-mono);margin:2px 4px 2px 0; }
        .diag-warning { background:oklch(0.64 0.2 25 / 18%);color:oklch(0.78 0.14 25); }
        .diag-error { background:oklch(0.50 0.22 25 / 25%);color:oklch(0.82 0.18 25);font-weight:600; }
        .diag-info { background:oklch(0.55 0.12 250 / 18%);color:oklch(0.72 0.10 250); }
        .beauty-score { font-family:var(--font-mono);font-size:20px;font-weight:600;letter-spacing:-0.5px; }
        .beauty-bar { height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin:4px 0; }
        .beauty-fill { height:100%;border-radius:3px;transition:width 0.5s ease; }
        .speaker-name .tok-actor {
            font-weight: 700;
        }
        .verse-line {
            display: block;
            padding-left: 24px;
            text-indent: 0;
        }
        .genre-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 3px;
            background: oklch(0.22 0.01 260);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }
        .tok-actor {
            font-weight: 500;
            text-decoration: underline;
            text-decoration-color: color-mix(in srgb, var(--primary) 50%, transparent);
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .tok-actor:hover {
            background-color: color-mix(in srgb, var(--primary) 12%, transparent);
        }
        .tok-entropy-high {
            text-decoration: underline wavy;
            text-decoration-color: var(--signal-high);
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .tok-entropy-high:hover {
            background-color: color-mix(in srgb, var(--signal-high) 10%, transparent);
        }
        .tok-entropy-mid {
            text-decoration: underline auto;
            text-decoration-color: var(--signal-amber);
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .tok-entropy-mid:hover {
            background-color: color-mix(in srgb, var(--signal-amber) 10%, transparent);
        }
        .tok-entropy-low {
            text-decoration: underline dotted;
            text-decoration-color: color-mix(in srgb, var(--signal-amber) 60%, var(--primary));
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .tok-entropy-low:hover {
            background-color: color-mix(in srgb, var(--primary) 8%, transparent);
        }

        /* ── Highlight Modes ── */
        /* Reset helpers — hide specific highlight types */
        .hl-hide-entropy .tok-entropy-high,
        .hl-hide-entropy .tok-entropy-mid,
        .hl-hide-entropy .tok-entropy-low { text-decoration: none !important; border-bottom: none !important; }

        .hl-hide-operators .tok-operator {
            color: var(--text) !important;
            background: none !important;

                    <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><span id="hlModeLabel" style="font-size:11px;">Все</span>

    <script>
    /* ═══════════════════════════════════════════════════
       Logos Spectrum v5.2 — Client Logic
       API: POST /api/entropy_map → { data: Token[] }
       ═══════════════════════════════════════════════════ */

    const ACTOR_COLORS = ['var(--actor-1)','var(--actor-2)','var(--actor-3)','var(--actor-4)','var(--actor-5)','var(--actor-6)','var(--actor-7)','var(--actor-8)'];
    const ACTOR_HEX = ['#c9a832','#5b8def','#4ade80','#f87171','#a78bfa','#fb923c','#2dd4bf','#f472b6'];
    const OP_SYM = { contrast:'↔', emphasis:'↑', hedge:'?', logic:'§', modal:'◊', amplifier:'!', inversion:'¿', parenthetical:'—' };
    const OP_LABEL = { contrast:'Contrast', emphasis:'Emphasis', hedge:'Hedge', logic:'Logic', modal:'Modality', amplifier:'Amplifier', inversion:'Inversion', parenthetical:'Parenthetical' };
    const OP_COLOR = {
        contrast: 'oklch(0.68 0.20 15)',     // rose
        emphasis: 'oklch(0.82 0.16 85)',      // amber
        hedge:    'oklch(0.68 0.17 250)',      // blue
        logic:    'oklch(0.72 0.17 150)',      // green
        modal:    'oklch(0.68 0.18 310)',      // violet
        amplifier:'oklch(0.78 0.18 50)',       // coral (distinct from emphasis)
        inversion:'oklch(0.70 0.16 195)',      // teal (distinct from hedge)
        parenthetical:'oklch(0.62 0.01 260)',  // muted
    };

    let data = [];       // raw token array from API
    let clips = [];      // sentence-level clips
    let originalText = ''; // preserved for whitespace recovery
    let editing = false;
    let lastScrollPercent = 0;
    let inspectorVisible = true;
    let timelineVisible = true;
    let lightTheme = false;
    let selectedClip = null;
    let focusedTrack = null; // {id, actorName?} — solo'd track
    let actorList = [];   // [{name, count}]
    let actorColorMap = {};
    let stylometry = null;  // StylometryResult from backend
    let rhythm = [];        // sentence lengths array
    let genre = 'prose';    // prose / verse_drama / poetry
    let dialogueFormat = 'unknown'; // drama / prose_em / prose_q / mixed
    let plotArc = null;     // {tensions, stages, events, diagnostics, beauty_score, ...}
    let textSegments = [];  // [{after_token, type, level, reason}] from server
    let entities = [];      // observable entity salience from server
    let scenes = [];        // scene participants with ternary knowledge status
    let referenceStability = null;
    let documentStructure = [];
    let workTitle = '';
    let workAuthor = '';
    const LARGE_DOCUMENT_TOKEN_LIMIT = 8000; // Keep full text interaction within browser rendering limits.
    let largeDocument = false;

    const SAMPLE = `Утро в доме Фамусова начиналось тихо. Софья сидела у окна и смотрела на пустую улицу, где медленно таял ночной туман. Однако тишина была обманчива: в передней уже слышались быстрые шаги.

— Кто там ходит в такую рань? — спросила Софья, не оборачиваясь.

— Александр Андреевич Чацкий приехал, — ответила Лиза, и в её голосе слышалась тревога. — Только что с дороги, даже не переоделся.

Чацкий вошёл стремительно, словно ветер. Три года странствий не изменили его: та же ирония во взгляде, та же неукротимая энергия. Но Софья встретила его холодно, и именно эта холодность ранила его сильнее любых слов.

— Чуть свет — уж на ногах, и я у ваших ног! — воскликнул Чацкий с радостью, которая тут же погасла.

Он говорил о Москве, о нравах, о глупости старого мира. Возможно, он был прав. Однако правда, сказанная невпопад, звучит как оскорбление. Софья молчала, потому что её сердце уже принадлежало другому — тихому и удобному Молчалину.

Фамусов появился в дверях, недовольный и заспанный. Он не любил перемен, не любил вопросов, особенно не любил умников. Следовательно, Чацкий был для него катастрофой: возмутителем спокойствия, разрушителем иерархии, ходячей декларацией независимости.

— Служить бы рад, прислуживаться тошно, — бросил Чацкий, и эта фраза повисла в воздухе, как приговор.

Вечером дом наполнился гостями. Шум, смех, сплетни — привычная механика светской жизни. Кто-то пустил слух о безумии Чацкого, и слух побежал по залам быстрее огня. Даже те, кто ничего не понял, кивали со значением. Так рождается общественное мнение: не из фактов, а из страха отстать от других.

Чацкий стоял посреди толпы и вдруг понял, что он здесь чужой. Не потому, что его не любили. А потому, что его не слышали. Он говорил на другом языке — языке смысла, а вокруг звучал язык ритуала.

— Карету мне, карету! — крикнул он, и в этом крике было больше горя, чем гнева.

Утром дом Фамусова снова затих. Софья плакала у окна. Туман рассеялся, но ясности не наступило.`;

    // ── Utility ──
    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1200);
    }
    function entropyColor(h, alpha=1) {
        // Full cold-to-hot spectrum: violet → blue → magenta → red → orange.
        const t = Math.max(0, Math.min(10, Number(h) || 0)) / 10;
        const hue = 285 - t * 270;
        const lightness = 0.40 + t * 0.38;
        const chroma = 0.18 + t * 0.16;
        return `oklch(${lightness.toFixed(3)} ${chroma.toFixed(3)} ${hue.toFixed(1)} / ${alpha})`;
    }
    function arousalColor(a, alpha=1) {
        // 1=deep blue calm → 9=bright red-orange excitation.
        if (!a || isNaN(a)) return `oklch(0.46 0.16 220 / ${alpha})`;
        const t = Math.max(0, Math.min(1, (a - 1) / 8));
        const hue = 225 - t * 205;
        const lightness = 0.42 + t * 0.34;
        const chroma = 0.16 + t * 0.14;
        return `oklch(${lightness.toFixed(3)} ${chroma.toFixed(3)} ${hue.toFixed(1)} / ${alpha})`;
    }
    function concColor(c, alpha=1) {
        // 1=deep violet abstraction → 5=bright amber concreteness.
        if (!c || isNaN(c)) return `oklch(0.42 0.18 305 / ${alpha})`;
        const t = Math.max(0, Math.min(1, (c - 1) / 4));
        const hue = 305 - t * 220;
        const lightness = 0.42 + t * 0.34;
        const chroma = 0.18 + t * 0.12;
        return `oklch(${lightness.toFixed(3)} ${chroma.toFixed(3)} ${hue.toFixed(1)} / ${alpha})`;
    }

    // ── Map token positions back to original text for whitespace recovery ──
    function mapTokenPositions() {
        let pos = 0;
        data.forEach(t => {
            const idx = originalText.indexOf(t.word, pos);
            if (idx >= 0 && idx < pos + 200) {
                // Found within reasonable distance
                t._gap = originalText.slice(pos, idx);
                t._charStart = idx;
                pos = idx + t.word.length;
            } else {
                // Try from current pos with small lookahead (handles minor mismatches)
                const near = originalText.indexOf(t.word, Math.max(0, pos - 5));
                if (near >= 0 && near < pos + 100) {
                    t._gap = originalText.slice(pos, near);
                    t._charStart = near;
                    pos = near + t.word.length;
                } else {
                    t._gap = ' '; // fallback
                }
            }
        });
    }

    // ── Punctuation as operators (client-side enrichment, §4.2) ──
    function enrichPunctuationOps() {
        const PUNCT_MAP = {
            '!': 'amplifier',
            '?': 'inversion',
            '—': 'parenthetical',
            '–': 'parenthetical',
        };
        data.forEach(t => {
            if (!t.is_operator && PUNCT_MAP[t.word]) {
                t.is_operator = true;
                t.op_type = PUNCT_MAP[t.word];
            }
            // Ellipsis
            if (!t.is_operator && t.word === '…') {
                t.is_operator = true;
                t.op_type = 'hedge';
            }
        });
    }

    // ── Clipping: group raw tokens into sentence-level clips ──
    function buildClips() {
        clips = [];
        if (!data.length) return;
        let clip = newClip(0);
        data.forEach((t, i) => {
            clip.tokens.push({ ...t, _i: i });
            if (/[.!?…]/.test(t.word) && i < data.length - 1) {
                // Don't split if next token is closing punct (avoids orphaned ) on new line)
                const next = data[i + 1];
                if (!/^[)\]}>»"']$/.test(next.word)) {
                    finalizeClip(clip);
                    clips.push(clip);
                    clip = newClip(clips.length);
                }
            }
        });
        if (clip.tokens.length) { finalizeClip(clip); clips.push(clip); }

        // Actors — combine entity detection + speaker metadata
        const counts = {};
        data.forEach(t => {
            if (t.is_entity && t.entity_type === 'person' && t.confidence >= 0.6) {
                counts[t.clean] = (counts[t.clean] || 0) + 1;
            }
            // Also count speaker names (these come from structural detection)
            if (t.speaker) {
                counts[t.speaker] = (counts[t.speaker] || 0) + 1;
            }
        });
        actorList = Object.entries(counts)
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count);
        actorColorMap = {};
        actorList.slice(0, 8).forEach((a, i) => {
            actorColorMap[a.name] = { css: ACTOR_COLORS[i % ACTOR_COLORS.length], hex: ACTOR_HEX[i % ACTOR_HEX.length] };
        });
    }
    function newClip(idx) {
        return { index: idx, tokens: [], wordCount: 0, entropySum: 0, maxEntropy: 0,
                 sentimentSum: 0, sentimentHits: 0, valSum: 0, valHits: 0,
                 aroSum: 0, aroHits: 0, concSum: 0, concHits: 0,
                 operators: [], actors: new Set(), isDialogue: false };
    }
    function finalizeClip(c) {
        let words = 0, eSum = 0, maxE = 0, sSum = 0, sHits = 0;
        let valSum = 0, valHits = 0, aroSum = 0, aroHits = 0, concSum = 0, concHits = 0;
        const ops = [], actors = new Set();
        let hasDial = false;
        c.tokens.forEach(t => {
            if (t.word[0] && t.word[0].match(/[а-яА-Яa-zA-Z0-9]/)) {
                words++;
                const h = t.h || 0.5;
                eSum += h; maxE = Math.max(maxE, h);
                if (t.s > 0 || t.s < 0) { sSum += t.s; sHits++; }
                // Continuous affect norms
                if (t.val && t.val > 0) { valSum += t.val; valHits++; }
                if (t.aro && t.aro > 0) { aroSum += t.aro; aroHits++; }
                if (t.conc && t.conc > 0) { concSum += t.conc; concHits++; }
            }
            if (t.is_operator) ops.push({ kind: t.op_type, word: t.word });
            // Skip structural tokens for actor/dialogue: headings and cast lists
            // should not appear as "turns" on actor tracks
            const isStructural = t.line_type === 'HEADER' || t.line_type === 'CHARACTERS_LINE' 
                                 || t.line_type === 'SPEAKER' || t.line_type === 'STAGE_DIRECTION';
            if (t.is_entity && t.confidence >= 0.6 && !isStructural) actors.add(t.clean);
            // Speaker identity is propagated to dialogue tokens by the API;
            // include it so role tracks have visible cells, not only labels.
            if (t.speaker && !isStructural) actors.add(t.speaker);
            if (t.is_dialogue && !isStructural) hasDial = true;
        });
        c.wordCount = words;
        c.avgEntropy = words ? eSum / words : 0;
        c.maxEntropy = maxE;
        c.sentiment = sHits ? sSum / Math.max(sHits, 2) : 0;
        c.avgValence = valHits ? valSum / valHits : 0;
        c.avgArousal = aroHits ? aroSum / aroHits : 0;
        c.avgConcreteness = concHits ? concSum / concHits : 0;
        c.operators = ops;
        c.actors = [...actors];
        c.isDialogue = hasDial;
        c.text = c.tokens.map(t => (t._gap || '') + t.word).join('');
        // Detect paragraph boundary from original whitespace
        c.startsNewParagraph = c.tokens.length > 0 && c.tokens[0]._gap && /\n\n/.test(c.tokens[0]._gap);
        // Also detect if any token in this clip has \n\n in its gap (mid-clip paragraph)
        if (!c.startsNewParagraph) {
            c.startsNewParagraph = c.tokens.some(t => t._gap && /\n\n/.test(t._gap));
        }
    }

    // ── Apply server-side structural segments to clips ──
    function applyServerSegments() {
        if (!textSegments.length || clips.length < 2) return;

        // Build token→clip map: for each token index, which clip does it belong to?
        const tokenToClip = {};
        clips.forEach(clip => {
            clip.tokens.forEach(t => { tokenToClip[t._i] = clip.index; });
        });

        // Map each segment boundary to the clip that starts after it
        textSegments.forEach(seg => {
            const afterTok = seg.after_token;
            // Find the clip that contains the NEXT token after the boundary
            let nextClipIdx = null;
            for (let ti = afterTok + 1; ti < data.length; ti++) {
                if (tokenToClip[ti] !== undefined) {
                    nextClipIdx = tokenToClip[ti];
                    break;
                }
            }
            if (nextClipIdx !== null && nextClipIdx > 0 && nextClipIdx < clips.length) {
                const clip = clips[nextClipIdx];
                clip.startsNewParagraph = true;
                clip._breakLevel = Math.max(clip._breakLevel || 0, seg.level);
                clip._breakType = seg.type;
                clip._breakReason = seg.reason;
            }
        });
    }

    // ── API ──
    const ANALYSIS_CACHE_DB = 'logos_spectrum';
    const ANALYSIS_CACHE_STORE = 'analysis_v2';
    let activeAnalysisController = null;

    function analysisCacheKey(text) {
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return `${text.length}:${(hash >>> 0).toString(16)}`;
    }

    function openAnalysisCache() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(ANALYSIS_CACHE_DB, 2);
            request.onupgradeneeded = () => {
                if (!request.result.objectStoreNames.contains(ANALYSIS_CACHE_STORE)) {
                    request.result.createObjectStore(ANALYSIS_CACHE_STORE);
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function readCachedAnalysis(key) {
        const db = await openAnalysisCache();
        return new Promise((resolve, reject) => {
            const request = db.transaction(ANALYSIS_CACHE_STORE, 'readonly')
                .objectStore(ANALYSIS_CACHE_STORE).get(key);
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error);
        });
    }

    async function writeCachedAnalysis(key, response) {
        const db = await openAnalysisCache();
        return new Promise((resolve, reject) => {
            const request = db.transaction(ANALYSIS_CACHE_STORE, 'readwrite')
                .objectStore(ANALYSIS_CACHE_STORE).put(response, key);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    function applyAnalysis(text, json) {
        originalText = text;
        if (json.data) {
            data = json.data;
            largeDocument = data.length > LARGE_DOCUMENT_TOKEN_LIMIT;
            stylometry = json.stylometry || null;
            rhythm = json.rhythm || [];
            genre = json.genre || 'prose';
            dialogueFormat = json.dialogue_format || 'unknown';
            plotArc = json.plot_arc || null;
            textSegments = json.segments || [];
            entities = json.entities || [];
            scenes = json.scenes || [];
            referenceStability = json.reference_stability || null;
            documentStructure = json.document_structure || [];
            inferWorkMetadata(text);
            enrichPunctuationOps();
            mapTokenPositions();
            buildClips();
            applyServerSegments();
            selectedClip = clips.length - 1;
            render();
        }
    }

    async function analyze(text) {
        activeAnalysisController?.abort();
        activeAnalysisController = new AbortController();
        const controller = activeAnalysisController;
        document.body.classList.add('loading');
        originalText = text;
        try { localStorage.setItem('logos_spectrum_text', text); } catch (_) {}
        try {
            const cached = await readCachedAnalysis(analysisCacheKey(text));
            if (cached && cached.data) {
                applyAnalysis(text, cached);
                return;
            }
        } catch (error) {
            console.warn('Analysis cache unavailable; requesting analysis.', error);
        }
        try {
            const res = await fetch('/api/entropy_map', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
                signal: controller.signal,
            });
            if (!res.ok) throw new Error(`Analysis failed (${res.status})`);
            const json = await res.json();
            if (controller.signal.aborted) return;
            if (json.data) {
                try { await writeCachedAnalysis(analysisCacheKey(text), json); }
                catch (error) { console.warn('Analysis result was not cached.', error); }
                applyAnalysis(text, json);
            }
        } catch (e) { console.error(e); }
        finally { document.body.classList.remove('loading'); }
    }


    function inferWorkMetadata(text) {
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        const headingIndex = lines.findIndex(line =>
            /^(?:глава|часть|chapter|part|пролог|эпилог)\b/i.test(line) ||
            /^(?:[IVXLCDM]+|\d+[.)]?)$/i.test(line)
        );
        const titleBlock = lines.slice(0, headingIndex >= 0 ? headingIndex : Math.min(lines.length, 4));
        const namePattern = /^[\p{Lu}][\p{Ll}'’-]+(?:\s+[\p{Lu}][\p{Ll}'’-]+){1,3}$/u;
        const authorIndex = titleBlock.findIndex(line => namePattern.test(line));
        const titleCandidates = titleBlock.filter((line, index) =>
            index !== authorIndex && line.length <= 120 && !namePattern.test(line)
        );
        workAuthor = authorIndex >= 0 ? titleBlock[authorIndex] : 'Автор не указан';
        workTitle = titleCandidates[0] || (authorIndex > 0 ? titleBlock[0] : 'Без названия');
    }

    function semanticDocumentMarkup(value) {
        return value.replace(/^&gt;\s+([^\n]+)$/gm, '<blockquote class="semantic-blockquote">$1</blockquote>');
    }

    function semanticInline(text) {
        let value = escHtml(text);
        value = value.replace(/`([^`]+)`/g, '<code class="semantic-code">$1</code>');
        value = value.replace(/\^([^\^]+)\^/g, '<sup>$1</sup>');
        value = value.replace(/~([^~]+)~/g, '<sub>$1</sub>');
        value = value.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        value = value.replace(/_([^_]+)_/g, '<em>$1</em>');
        value = value.replace(/==([^=]+)==/g, '<mark class="semantic-mark">$1</mark>');
        return value;
    }

    function renderLibrary() {
        const el = document.getElementById('librarySidebar');
        if (!el) return;
        const words = data.filter(t => /^[\p{L}\p{N}]/u.test(t.word)).length;
        const chapters = documentStructure.filter(item => item.kind === 'chapter' && item.status === 'confirmed');
        const candidates = documentStructure.filter(item => item.kind === 'chapter' && item.status === 'unknown');

        // Dynamic active chapter detection based on selectedClip playhead
        let activeChapterIndex = -1;
        if (selectedClip !== null) {
            const activeClip = clips.find(c => c.index === selectedClip);
            if (activeClip && activeClip.tokens && activeClip.tokens.length) {
                const firstTok = activeClip.tokens[0];
                if (firstTok && Number.isFinite(firstTok._charStart)) {
                    activeChapterIndex = chapters.findIndex(ch => firstTok._charStart >= ch.char_range[0] && firstTok._charStart < ch.char_range[1]);
                    if (activeChapterIndex === -1 && chapters.length) {
                        const lastCh = chapters[chapters.length - 1];
                        if (firstTok._charStart >= lastCh.char_range[0]) {
                            activeChapterIndex = chapters.length - 1;
                        }
                    }
                }
            }
        }

        // Calculate sizes
        const chCounts = chapters.map(ch => data.filter(t => Number.isFinite(t._charStart) && t._charStart >= ch.char_range[0] && t._charStart < ch.char_range[1]).length);
        const maxChCount = Math.max(...chCounts, 1);

        const candCounts = candidates.map(ch => data.filter(t => Number.isFinite(t._charStart) && t._charStart >= ch.char_range[0] && t._charStart < ch.char_range[1]).length);
        const maxCandCount = Math.max(...candCounts, 1);

        const chHtml = chapters.length ? chapters.map((chapter, index) => {
            const count = chCounts[index];
            const pct = (count / maxChCount) * 100;
            const activeClass = index === activeChapterIndex ? ' active' : '';
            return `<button class="chapter-item confirmed${activeClass}" onclick="jumpToPosition(${chapter.char_range[0]})">
                <span class="chapter-dot"></span>
                <span style="flex-shrink:0;width:36px;font-weight:500;">${escHtml(chapter.title || `Гл. ${index + 1}`)}</span>
                <span class="chapter-bar-container">
                    <span class="chapter-bar" style="display:block;width:${pct}%"></span>
                </span>
                <span class="chapter-count">${count}</span>
            </button>`;
        }).join('') : '<div class="chapter-empty">Подтверждённые главы не найдены.</div>';

        const candHtml = candidates.length ? candidates.map((chapter, index) => {
            const count = candCounts[index];
            const pct = (count / maxCandCount) * 100;
            return `<button class="chapter-item unknown" onclick="jumpToPosition(${chapter.char_range[0]})">
                <span class="chapter-dot"></span>
                <span style="flex-shrink:0;width:36px;font-weight:500;">${escHtml(chapter.title)}</span>
                <span class="chapter-bar-container">
                    <span class="chapter-bar" style="display:block;width:${pct}%"></span>
                </span>
                <span class="chapter-count">${count}</span>
            </button>`;
        }).join('') : '';

        el.innerHTML = `
            <div class="library-kicker">Произведение</div>
            <h1 class="library-title" style="font-family:var(--font-serif);font-size:15px;font-weight:500;margin-bottom:2px;">${escHtml(workTitle || 'Без названия')}</h1>
            <div class="library-author" style="font-family:var(--font-serif);font-size:13px;margin-bottom:12px;">${escHtml(workAuthor || 'Автор не указан')}</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-muted);margin-bottom:18px;">
                <span style="background:var(--surface);border:1px solid var(--border-subtle);border-radius:3px;padding:2px 6px;">${data.length.toLocaleString('ru-RU')} токенов</span>
                <span style="background:var(--surface);border:1px solid var(--border-subtle);border-radius:3px;padding:2px 6px;">${words.toLocaleString('ru-RU')} слов</span>
            </div>
            <div class="library-kicker">Главы</div>
            <div class="chapter-list">${chHtml}</div>
            ${candidates.length ? `<div class="library-kicker" style="margin-top:18px">Кандидаты</div><div class="chapter-list">${candHtml}</div>` : ''}
        `;
    }

    function jumpToPosition(charPosition) {
        if (largeDocument) {
            const anchor = document.getElementById(`chapter-${charPosition}`);
            if (anchor) anchor.scrollIntoView({behavior: 'smooth', block: 'start'});
            return;
        }
        const foundIndex = data.findIndex(token => Number.isFinite(token._charStart) && token._charStart >= charPosition);
        const index = Math.max(0, foundIndex >= 0 ? foundIndex : data.length - 1);
        const clip = clips.find(item => item.tokens.some(token => token._globalIndex >= index));
        if (clip) { selectedClip = clip.index; render(); }
    }

    function render() {
        renderLibrary();
        renderTextPane();
        renderInspector();
        renderTimeline();
        updateStats();
    }

    function updateStats() {
        const el = document.getElementById('stats');
        if (!clips.length) { el.textContent = ''; return; }
        const words = data.filter(t => t.word[0] && t.word[0].match(/[а-яА-Яa-zA-Z0-9]/)).length;
        const genreLabel = genre === 'verse_drama' ? ' · драма' : genre === 'poetry' ? ' · стихи' : '';
        el.textContent = `${clips.length} клипов · ${words} слов${genreLabel}`;
    }

    // ── Text Pane ──
    function renderTextPane() {
        const pane = document.getElementById('textPane');
        const scrollPercent = lastScrollPercent;

        if (editing) {
            pane.classList.add('editing');
            const saved = localStorage.getItem('logos_spectrum_text') || SAMPLE;
            pane.innerHTML = `<div class="edit-area text-content" id="editArea" contenteditable="true" placeholder="Вставьте текст для анализа…">${formatRawTextForEditing(saved)}</div>`;
            
            const area = document.getElementById('editArea');
            if (area) {
                area.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                    document.execCommand('insertText', false, text);
                });
            }

            setTimeout(() => {
                const denom = pane.scrollHeight - pane.clientHeight;
                if (denom > 0) pane.scrollTop = scrollPercent * denom;
            }, 0);
            return;
        }
        pane.classList.remove('editing');
        if (!clips.length) {
            pane.innerHTML = `<div class="text-content" style="color:var(--text-dim);text-align:center;padding-top:80px;">
                <div style="font-size:24px;margin-bottom:12px;opacity:0.3;">◎</div>
                Нажмите <strong>Правка</strong>, вставьте текст, затем снова <strong>Правка</strong> → Спектр.
            </div>`;
            return;
        }
        // Apply genre class to pane
        pane.classList.remove('genre-prose', 'genre-verse_drama', 'genre-poetry');
        pane.classList.add('genre-' + genre);
        HL_MODES.forEach(mode => pane.classList.remove('hl-' + mode));
        if (hlMode !== 'all') pane.classList.add('hl-' + hlMode);
        if (largeDocument) {
            const chapterByStart = new Map(documentStructure
                .filter(item => item.kind === 'chapter' && item.status === 'confirmed')
                .map(item => [item.char_range[0], item.title]));
            const parts = [];
            const chapterStarts = new Map([...chapterByStart.entries()].sort((a, b) => a[0] - b[0]));
            const tokenClipMap = new Map();
            clips.forEach(clip => clip.tokens.forEach(token => tokenClipMap.set(token._i, clip.index)));
            const tokenHtml = (token, tokenIndex) => {
                const word = escHtml(token.word);
                if (!token.word || !/^[\p{L}\p{N}]/u.test(token.word)) return word;
                const classes = [];
                if (token.line_type === 'SPEAKER') classes.push('speaker-name');
                if (token.line_type === 'STAGE_DIRECTION') classes.push('stage-direction');
                if (token.line_type === 'HEADER' || token.line_type === 'CHARACTERS_LINE') classes.push('act-header');
                if (token.speaker || token.turn_id !== undefined) classes.push('tok-turn');
                if (token.is_entity && token.confidence >= 0.6) classes.push('tok-actor');
                if (token.is_operator) classes.push('tok-operator');
                if ((token.h || 0) >= 5) classes.push('tok-entropy-high');
                else if ((token.h || 0) >= 3.5) classes.push('tok-entropy-mid');
                else if ((token.h || 0) >= 2) classes.push('tok-entropy-low');
                const clipIndex = tokenClipMap.get(tokenIndex);
                if (clipIndex !== undefined && selectedClip === clipIndex) classes.push('clip-selected-token');
                const tokenAttrs = Number.isInteger(tokenIndex) ? ` data-token-index="${tokenIndex}"${clipIndex !== undefined ? ` data-clip="${clipIndex}"` : ''}` : '';
                return classes.length || tokenAttrs ? `<span class="${classes.join(' ')}"${tokenAttrs}>${word}</span>` : word;
            };
            let paragraph = '';
            let chapterSkipEnd = -1;
            const flushParagraph = () => {
                if (paragraph.trim()) parts.push(`<p>${paragraph}</p>`);
                paragraph = '';
            };
            data.forEach((token, index) => {
                const charStart = token._charStart || 0;
                const title = chapterStarts.get(charStart);
                if (title) {
                    flushParagraph();
                    parts.push(`<hr class="chapter-rule" aria-hidden="true"><h3 class="chapter-anchor" id="chapter-${charStart}">${escHtml(title)}</h3>`);
                    const lineEnd = originalText.indexOf('\n', charStart);
                    chapterSkipEnd = lineEnd >= 0 ? lineEnd + 1 : originalText.length;
                }
                if (chapterSkipEnd >= 0 && charStart < chapterSkipEnd) return;
                const gap = token._gap || '';
                if (/\n\s*\n/.test(gap)) flushParagraph();
                paragraph += escHtml(gap).replace(/\n/g, ' ') + tokenHtml(token, index);
            });
            flushParagraph();
            pane.innerHTML = `<article class="text-content large-document-text">${parts.join('')}</article>`;
            setTimeout(() => {
                const denom = pane.scrollHeight - pane.clientHeight;
                if (denom > 0) pane.scrollTop = scrollPercent * denom;
            }, 0);
            return;
        }
        const nodes = [];
        let inStageDir = false;
        let inHeader = false;
        let inSpeakerLabel = false;
        let inCharsLine = false;
        clips.forEach(clip => {
            // Insert structural break between clips (driven by server segments)
            if (clip.startsNewParagraph && clip.index > 0) {
                const level = clip._breakLevel || 1;
                const type = clip._breakType || 'paragraph';

                if (level >= 3 || type === 'heading') {
                    // Act / Chapter / Heading — biggest visual break
                    nodes.push('<div class="para-break-lg"></div>');
                } else if (level >= 2 || type === 'scene' || type === 'speaker' || type === 'characters_line') {
                    // Scene / Speaker / Cast — medium break
                    nodes.push('<div class="para-break-md"></div>');
                } else if (type === 'stage_direction') {
                    // Stage direction — just a tiny gap
                    nodes.push('<div class="para-break-sm"></div>');
                } else {
                    // Paragraph / dialogue turn — small break
                    nodes.push('<div class="para-break-sm"></div>');
                }
            }
            const isSel = selectedClip === clip.index;
            const cls = ['clip-span'];
            if (isSel) cls.push('selected');
            if (clip.isDialogue) cls.push('is-dialogue');
            // Focus dimming for actor tracks
            if (focusedTrack) {
                if (focusedTrack.id === 'actor') {
                    cls.push(clip.actors.includes(focusedTrack.actorName) ? 'focus-bright' : 'focus-dimmed');
                } else if (focusedTrack.id === 'dialogue') {
                    cls.push(clip.isDialogue ? 'focus-bright' : 'focus-dimmed');
                } else if (focusedTrack.id === 'operators') {
                    cls.push(clip.operators.length > 0 ? 'focus-bright' : 'focus-dimmed');
                }
            }
            let inner = '';
            clip.tokens.forEach((t, idx) => {
                const gap = t._gap || '';
                if (gap) {
                    // Punctuation that must stay glued to the previous word (closing/trailing)
                    const isClosingPunct = /^[.)\]},;:!?…»"'—–]$/.test(t.word);
                    
                    if (/\n\n/.test(gap) && t !== clip.tokens[0]) {
                        // Double newline = paragraph break
                        if (inStageDir || isClosingPunct) {
                            inner += isClosingPunct ? '' : ' ';
                        } else {
                            inner += '</span><div class="para-break-md"></div><span class="' + cls.join(' ') + '" data-clip="' + clip.index + '" onclick="selectClip(' + clip.index + ')">';
                        }
                    } else if (/\n/.test(gap)) {
                        if (inStageDir || isClosingPunct) {
                            // Never break inside stage direction or before closing punct
                            inner += isClosingPunct ? '' : ' ';
                        } else if (genre === 'verse_drama' || genre === 'poetry') {
                            inner += '<br>';
                        } else {
                            inner += ' ';
                        }
                    } else {
                        inner += gap;
                    }
                }

                // Structural elements — use server line_type instead of client heuristics
                // Stage directions (works for all genres)
                if (t.line_type === 'STAGE_DIRECTION') {
                    if (t.word === '(' && !inStageDir) { inner += '<span class="stage-direction">('; inStageDir = true; return; }
                    if (t.word === ')' && inStageDir) { inner += ')</span>'; inStageDir = false; return; }
                    if (inStageDir) { inner += escHtml(t.word); return; }
                    // Standalone stage direction line (full-line, already wrapped)
                    inner += `<span class="stage-direction">${escHtml(t.word)}</span>`;
                    return;
                }
                if (inStageDir && t.line_type !== 'STAGE_DIRECTION') {
                    inner += '</span>';
                    inStageDir = false;
                }

                // Headers — group consecutive HEADER tokens into one span
                if (t.line_type === 'HEADER') {
                    if (!inHeader) { inner += '<span class="act-header">'; inHeader = true; }
                    inner += escHtml(t.word) + ' ';
                    // Check if next token is also HEADER
                    const nextIdx = idx + 1;
                    const nextTok = nextIdx < clip.tokens.length ? clip.tokens[nextIdx] : null;
                    if (!nextTok || nextTok.line_type !== 'HEADER') {
                        inner += '</span>';
                        inHeader = false;
                    }
                    return;
                }
                if (inHeader) { inner += '</span>'; inHeader = false; }

                // Speaker labels — group consecutive SPEAKER tokens
                if (t.line_type === 'SPEAKER') {
                    if (!inSpeakerLabel) { 
                        const c = actorColorMap[t.clean] || actorColorMap[t.word];
                        const color = c ? c.css : 'var(--text-muted)';
                        inner += `<span class="speaker-name" style="color:${color}">`;
                        inSpeakerLabel = true;
                    }
                    inner += escHtml(t.word) + ' ';
                    const nextIdx = idx + 1;
                    const nextTok = nextIdx < clip.tokens.length ? clip.tokens[nextIdx] : null;
                    if (!nextTok || nextTok.line_type !== 'SPEAKER') {
                        inner += '</span>';
                        inSpeakerLabel = false;
                    }
                    return;
                }
                if (inSpeakerLabel) { inner += '</span>'; inSpeakerLabel = false; }

                // Characters line (cast list) — group consecutive
                if (t.line_type === 'CHARACTERS_LINE') {
                    if (!inCharsLine) { inner += '<span class="act-header" style="font-size:0.9em">'; inCharsLine = true; }
                    inner += escHtml(t.word) + ' ';
                    const nextIdx = idx + 1;
                    const nextTok = nextIdx < clip.tokens.length ? clip.tokens[nextIdx] : null;
                    if (!nextTok || nextTok.line_type !== 'CHARACTERS_LINE') {
                        inner += '</span>';
                        inCharsLine = false;
                    }
                    return;
                }
                if (inCharsLine) { inner += '</span>'; inCharsLine = false; }

                // Determine turn tint (background for the entire turn)
                let turnBg = '';
                let turnCls = '';
                let turnTitle = '';
                if (t.speaker && actorColorMap[t.speaker]) {
                    const tc = actorColorMap[t.speaker];
                    turnBg = 'background:' + tc.css.replace(')', ' / 0.08)') + ';';
                    turnCls = 'tok-turn';
                    turnTitle = t.speaker;
                }

                const isWord = t.word[0] && t.word[0].match(/[а-яА-Яa-zA-Z0-9]/);
                
                // Build inner content (text styling)
                let wordHtml = '';
                if (!isWord && t.is_operator) {
                    const opc = OP_COLOR[t.op_type] || 'var(--primary)';
                    wordHtml = '<span class="tok-operator" style="color:' + opc + ';" title="' + (OP_LABEL[t.op_type]||t.op_type) + '">' + escHtml(t.word) + '</span>';
                } else if (!isWord) {
                    wordHtml = escHtml(t.word);
                } else if (t.is_operator) {
                    const opc = OP_COLOR[t.op_type] || 'var(--primary)';
                    wordHtml = '<span class="tok-operator" style="color:' + opc + ';background:' + opc.replace(')', ' / 12%)') + ';" title="' + (OP_LABEL[t.op_type]||t.op_type) + '">' + escHtml(t.word) + '</span>';
                } else if (t.is_entity && t.confidence >= 0.6) {
                    const ec = actorColorMap[t.clean];
                    const color = ec ? ec.css : 'var(--text)';
                    wordHtml = '<span class="tok-actor" style="color:' + color + '" title="' + t.clean + '">' + escHtml(t.word) + '</span>';
                } else if ((t.h || 0) >= 5) {
                    wordHtml = '<span class="tok-entropy-high" title="H=' + (t.h||0).toFixed(2) + '">' + escHtml(t.word) + '</span>';
                } else if ((t.h || 0) >= 3.5) {
                    wordHtml = '<span class="tok-entropy-mid" title="H=' + (t.h||0).toFixed(2) + '">' + escHtml(t.word) + '</span>';
                } else if ((t.h || 0) >= 2) {
                    wordHtml = '<span class="tok-entropy-low" title="H=' + (t.h||0).toFixed(2) + '">' + escHtml(t.word) + '</span>';
                } else {
                    wordHtml = escHtml(t.word);
                }

                // Wrap in turn span if speaker assigned
                if (turnCls) {
                    inner += '<span class="' + turnCls + '" style="' + turnBg + '" title="' + turnTitle + '" data-turn="' + t.turn_id + '">' + wordHtml + '</span>';
                } else {
                    inner += wordHtml;
                }
            });
            if (inStageDir) inner += '</span>';
            nodes.push(`<span class="${cls.join(' ')}" data-clip="${clip.index}" onclick="selectClip(${clip.index})">${inner}</span>`);
        });
        pane.innerHTML = `<div class="text-content">${nodes.join('')}</div>`;
        // Scroll selected into view
        if (selectedClip !== null) {
            const el = pane.querySelector(`[data-clip="${selectedClip}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        setTimeout(() => {
            const denom = pane.scrollHeight - pane.clientHeight;
            if (denom > 0) pane.scrollTop = scrollPercent * denom;
        }, 0);
    }

    // ── Inspector ──
    function renderInspector() {
        const el = document.getElementById('inspector');
        el.className = inspectorVisible ? 'inspector' : 'inspector hidden';
        if (!inspectorVisible) return;

        const makeMetricBar = (label, value, pct, colorValue) => {
            return `
                <div style="margin: 10px 0;">
                    <div style="display:flex;align-items:baseline;justify-content:space-between;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);">
                        <span>${label}</span>
                        <span class="insp-value" style="color:${colorValue || 'var(--text)'};font-size:12px;font-weight:500;">${value}</span>
                    </div>
                    <div style="margin-top:5px;height:4px;overflow:hidden;border-radius:2px;background:var(--border-subtle);">
                        <div style="height:100%;border-radius:2px;transition:width 0.3s;background:${colorValue || 'var(--primary)'};width:${Math.max(0, Math.min(100, pct))}%"></div>
                    </div>
                </div>
            `;
        };

        const clip = selectedClip !== null ? clips[selectedClip] : null;
        if (clip) {
            let opsHtml = '';
            if (clip.operators.length) {
                opsHtml = `<div class="insp-section-title">Операторы</div>` +
                    clip.operators.map(op => {
                        const opc = OP_COLOR[op.kind] || 'var(--primary)';
                        return `<div class="insp-op-row"><span class="insp-op-sym" style="color:${opc}">${OP_SYM[op.kind]||'•'}</span><span class="insp-op-label">${OP_LABEL[op.kind]||op.kind}</span><span class="insp-op-word">${escHtml(op.word)}</span></div>`;
                    }).join('');
            }
            let actorsHtml = '';
            if (clip.actors.length) {
                actorsHtml = `<div class="insp-section-title">Актёры в клипе</div><div>` +
                    clip.actors.map(a => `<span class="insp-actor-badge">${escHtml(a)}</span>`).join('') + `</div>`;
            }

            const maxWords = Math.max(...clips.map(c => c.wordCount), 1);
            const wordPct = (clip.wordCount / maxWords) * 100;
            const entropyPct = (clip.avgEntropy / 10) * 100;
            const maxEntropyPct = (clip.maxEntropy / 10) * 100;
            const sentimentPct = ((clip.sentiment + 1) / 2) * 100;
            const valencePct = (clip.avgValence / 10) * 100;
            const arousalPct = (clip.avgArousal / 10) * 100;
            const concPct = (clip.avgConcreteness / 10) * 100;

            const valenceColorVal = clip.avgValence > 6 ? 'var(--signal-low)' : clip.avgValence < 4 ? 'var(--signal-high)' : 'var(--text-muted)';
            const sentimentColorVal = clip.sentiment > 0 ? 'var(--signal-low)' : clip.sentiment < 0 ? 'var(--signal-high)' : 'var(--text-muted)';

            el.innerHTML = `
                <div class="inspector-title" style="margin-bottom: 12px;">Инспектор · Клип ${String(clip.index+1).padStart(2,'0')}</div>
                <div class="inspector-clip-text" style="font-family:var(--font-serif);font-size:13px;line-height:1.5;background:oklch(0.22 0.006 260 / 30%);border:1px solid var(--border-subtle);">${escHtml(clip.text.trim())}</div>
                ${makeMetricBar('Слов', clip.wordCount, wordPct, 'var(--text-muted)')}
                ${makeMetricBar('Энтропия ср.', clip.avgEntropy.toFixed(1), entropyPct, entropyColor(clip.avgEntropy))}
                ${makeMetricBar('Энтропия пик', clip.maxEntropy.toFixed(1), maxEntropyPct, entropyColor(clip.maxEntropy))}
                ${makeMetricBar('Сентимент', (clip.sentiment > 0 ? '+' : '') + clip.sentiment.toFixed(1), sentimentPct, sentimentColorVal)}
                ${clip.avgValence ? `
                ${makeMetricBar('Valence', clip.avgValence.toFixed(1), valencePct, valenceColorVal)}
                ${makeMetricBar('Arousal', clip.avgArousal.toFixed(1), arousalPct, arousalColor(clip.avgArousal))}
                ${makeMetricBar('Concreteness', clip.avgConcreteness.toFixed(1), concPct, concColor(clip.avgConcreteness))}
                ` : ''}
                <div class="insp-row" style="margin-top: 14px;"><span class="insp-label">Диалог</span><span class="insp-value">${clip.isDialogue?'Да':'Нет'}</span></div>
                ${opsHtml}${actorsHtml}`;
        } else {
            const totalWords = data.filter(t => t.word[0] && t.word[0].match(/[а-яА-Яa-zA-Z0-9]/)).length;
            const avgE = clips.length ? clips.reduce((s,c)=>s+c.avgEntropy,0)/clips.length : 0;
            const opCount = clips.reduce((s,c)=>s+c.operators.length, 0);

            // Character activity or cast
            let popHtml = '';
            if (entities.length) {
                const maxScore = Math.max(...entities.map(e => e.acting_score), 1);
                popHtml = `<div class="insp-section-title">Активность персонажей</div>` +
                    entities.slice(0,6).map(e => {
                        const pct = (e.acting_score / maxScore) * 100;
                        return `
                            <div style="margin: 8px 0;">
                                <div style="display:flex;align-items:baseline;justify-content:space-between;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);">
                                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;">${escHtml(e.canonical_name)}</span>
                                    <span style="color:var(--text-muted);font-size:11px;">${e.acting_score}</span>
                                </div>
                                <div style="margin-top:4px;height:4px;overflow:hidden;border-radius:2px;background:var(--border-subtle);">
                                    <div style="height:100%;border-radius:2px;background:var(--primary);width:${pct}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('') + `<div style="font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.3;">Рейтинг наблюдаемых ролей, не вывод о главном герое.</div>`;
            } else if (actorList.length) {
                const maxC = actorList[0].count;
                popHtml = `<div class="insp-section-title">Плотность населённости</div>` +
                    actorList.slice(0,6).map(a => {
                        const pct = (a.count / maxC) * 100;
                        return `
                            <div style="margin: 8px 0;">
                                <div style="display:flex;align-items:baseline;justify-content:space-between;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);">
                                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;">${escHtml(a.name)}</span>
                                    <span style="color:var(--text-muted);font-size:11px;">${a.count}</span>
                                </div>
                                <div style="margin-top:4px;height:4px;overflow:hidden;border-radius:2px;background:var(--border-subtle);">
                                    <div style="height:100%;border-radius:2px;background:var(--primary);width:${pct}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('');
            }

            const referenceHtml = referenceStability ? (() => {
                const r = referenceStability;
                const pct = Math.round(r.stability * 100);
                const color = pct >= 85 ? 'var(--signal-low)' : pct >= 60 ? 'var(--signal-amber)' : 'var(--signal-high)';
                const unresolved = r.unresolved.slice(0, 5).map(item =>
                    `<span class="diag-badge diag-warning" title="${escHtml(item.reason)}">${escHtml(item.pronoun)} · неясная ссылка</span>`
                ).join('');
                return `
                    <div class="insp-section-title">Стабильность референций</div>
                    ${makeMetricBar('Разрешено', `${r.resolved_count}/${r.total_pronouns}`, pct, color)}
                    ${unresolved ? `<div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;">${unresolved}</div>` : ''}
                    <div style="font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.3;">Показывает только местоимения с подтверждённым референтом; не угадывает ближайшее слово.</div>
                `;
            })() : '';

            const sceneHtml = scenes.length ? (() => {
                const statusLabel = { confirmed: 'подтверждён', unknown: 'не подтверждён', rejected: 'исключён' };
                const statusColor = { confirmed: 'var(--signal-low)', unknown: 'var(--signal-amber)', rejected: 'var(--signal-high)' };
                return `<div class="insp-section-title">Сцены и участники</div>` +
                    scenes.map((scene, index) => {
                        const people = scene.participants || [];
                        const entries = people.length ? people.map(person =>
                            `<div style="display:flex;align-items:baseline;gap:6px;font-size:11px;margin:3px 0;">
                                <span style="font-family:var(--font-mono);min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(person.name)}</span>
                                <span style="color:${statusColor[person.scene_status] || 'var(--text-muted)'}">${statusLabel[person.scene_status] || person.scene_status}</span>
                                <span style="color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${person.roles.map(escHtml).join(', ')}</span>
                            </div>`
                        ).join('') : `<div style="font-size:11px;color:var(--text-dim)">Нет распознанных участников</div>`;
                        return `<div style="padding:6px 0;border-bottom:1px solid var(--border-subtle)">
                            <div class="insp-label">Сцена ${String(index + 1).padStart(2, '0')} · токены ${scene.token_range[0] + 1}–${scene.token_range[1] + 1}</div>${entries}
                        </div>`;
                    }).join('');
            })() : '';

            // Data/Control plane metrics
            const wordTokens = data.filter(t => t.word[0] && t.word[0].match(/[а-яА-Яa-zA-Z0-9]/));
            const total = wordTokens.length || 1;
            const controlCount = wordTokens.filter(t => t.is_operator).length;
            const dataCount = total - controlCount;
            const dataPct = Math.round(dataCount / total * 100);
            const ctrlPct = 100 - dataPct;
            const gateRatio = dataPct > 0 ? (total / dataCount).toFixed(1) : '∞';

            const gateRatioHtml = `
                <div class="insp-section-title">Data / Control Plane</div>
                ${makeMetricBar('Data plane', `${dataPct}%`, dataPct, 'var(--signal-amber)')}
                ${makeMetricBar('Control plane', `${ctrlPct}%`, ctrlPct, 'var(--primary)')}
                <div class="insp-row" style="margin-top:10px;"><span class="insp-label">Gate savings</span><span class="insp-value">~${gateRatio}×</span></div>
            `;

            el.innerHTML = `
                <div class="inspector-title" style="margin-bottom: 12px;">Инспектор · Весь текст</div>
                ${makeMetricBar('Клипов', clips.length, (clips.length / 500) * 100, 'var(--text-muted)')}
                ${makeMetricBar('Слов', totalWords, (totalWords / 20000) * 100, 'var(--text-muted)')}
                ${makeMetricBar('Энтропия ср.', avgE.toFixed(1), (avgE / 10) * 100, entropyColor(avgE))}
                ${makeMetricBar('Операторов', opCount, (opCount / 1000) * 100, 'var(--primary)')}
                ${makeMetricBar('Актёров', actorList.length, (actorList.length / 50) * 100, 'var(--text-muted)')}
                <div class="insp-row" style="margin-top:14px;"><span class="insp-label">Диалоги</span><span class="insp-value">${clips.some(c=>c.isDialogue)?'Да':'Нет'}</span></div>
                <div class="insp-row"><span class="insp-label">Жанр</span><span class="genre-badge">${genre === 'verse_drama' ? 'Драма в стихах' : genre === 'poetry' ? 'Поэзия' : 'Проза'}</span></div>
                <div class="insp-row" style="border-bottom:1px solid var(--border-subtle);"><span class="insp-label">Формат</span><span class="genre-badge">${dialogueFormat === 'drama' ? 'Пьеса' : dialogueFormat === 'prose_em' ? 'Проза (тире)' : dialogueFormat === 'prose_q' ? 'Проза (кавычки)' : dialogueFormat === 'mixed' ? 'Смешанный' : '—'}</span></div>
                ${gateRatioHtml}
                ${stylometry ? (() => {
                    const s = stylometry;
                    return `
                        <div class="insp-section-title">Стилометрия</div>
                        <div class="insp-row"><span class="insp-label">TTR (richness)</span><span class="insp-value">${s.TTR}</span></div>
                        <div class="insp-row"><span class="insp-label">MSL (слов/предл.)</span><span class="insp-value">${s.MSL}</span></div>
                        <div class="insp-row"><span class="insp-label">HLR (hapax)</span><span class="insp-value">${s.HLR}</span></div>
                        <div class="insp-row"><span class="insp-label">Yule’s K</span><span class="insp-value">${s.yules_k}</span></div>
                        <div class="insp-row"><span class="insp-label">Вокабуляр Z</span><span class="insp-value" style="color:${s.vocab_richness_z > 0 ? 'var(--signal-low)' : 'var(--signal-high)'}">${s.vocab_richness_z > 0 ? '+' : ''}${s.vocab_richness_z}</span></div>
                    `;
                })() : ''}
                ${plotArc ? (() => {
                    const a = plotArc;
                    const bColor = a.beauty_score > 0.7 ? 'var(--signal-low)' : a.beauty_score > 0.4 ? 'var(--signal-amber)' : 'var(--signal-high)';
                    let diagHtml = '';
                    if (a.diagnostics && a.diagnostics.length) {
                        diagHtml = '<div style="margin-top:6px">' +
                            a.diagnostics.map(d =>
                            `<span class="diag-badge diag-${d.severity}">${d.severity==='error'?'❌':d.severity==='warning'?'⚠':'ℹ'} ${d.message}</span>`
